name: fjellfisk
description: Oppdrettslogg for landbasert fiskeoppdrett
publish_to: 'none'

version: 3.1.2+11

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # Excel export
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^13.3.1

  # Dagbokutskrift
  pdf: 3.12.0

  # Charts
  fl_chart: ^0.68.0

  # Utils
  intl: ^0.20.2

dev_dependencies:
  fake_cloud_firestore: ^4.3.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
      - assets/fonts/DejaVuSans.ttf
      - assets/fonts/DejaVuSans-Bold.ttf
      - assets/images/aquaculture_tank.png
