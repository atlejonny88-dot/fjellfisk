name: fjellfisk
description: Oppdrettslogg for landbasert fiskeoppdrett
publish_to: 'none'

version: 2.5.1+7

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5

  # Excel export
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: 10.0.0

  # Dagbokutskrift
  pdf: 3.12.0

  # Charts
  fl_chart: ^0.68.0

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
      - assets/fonts/DejaVuSans.ttf
      - assets/fonts/DejaVuSans-Bold.ttf
      - assets/images/aquaculture_tank.png
