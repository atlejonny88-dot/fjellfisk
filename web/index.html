<!DOCTYPE html>
<html lang="nb">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fjellfisk - drift og produksjon for Hardanger Fjellfisk.">
  <meta name="fjellfisk-build" content="__FJELLFISK_BUILD_ID__">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="fjellfisk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>fjellfisk</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="app-update.js" defer></script>
  <script>
    (function () {
      var flutterLoaded = false;

      function loadFlutter() {
        if (flutterLoaded) {
          return;
        }
        flutterLoaded = true;

        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        document.body.appendChild(script);
      }

      function clearFlutterCaches() {
        if (!window.caches) {
          return Promise.resolve();
        }

        return caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (key) {
            if (
              key === 'flutter-app-cache' ||
              key === 'flutter-temp-cache' ||
              key === 'flutter-app-manifest'
            ) {
              return caches.delete(key);
            }
            return Promise.resolve(false);
          }));
        });
      }

      function clearServiceWorkers() {
        if (!('serviceWorker' in navigator)) {
          return Promise.resolve();
        }

        return navigator.serviceWorker.getRegistrations().then(function (registrations) {
          return Promise.all(registrations.map(function (registration) {
            var worker = registration.active || registration.waiting || registration.installing;
            if (worker && new URL(worker.scriptURL).pathname ===
                new URL('flutter_service_worker.js', document.baseURI).pathname) {
              return registration.unregister();
            }
            return Promise.resolve(false);
          }));
        });
      }

      window.setTimeout(loadFlutter, 1500);

      Promise.all([
        clearFlutterCaches(),
        clearServiceWorkers()
      ]).then(loadFlutter).catch(function (error) {
        console.warn('Fjellfisk web cache cleanup failed:', error);
        loadFlutter();
      });
    }());
  </script>
</body>
</html>
