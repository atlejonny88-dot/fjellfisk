name: Flutter checks

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Test web release updates
        run: node --test tool/web_update.test.cjs

      - name: Set up Node for local rules tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install rules test dependencies
        run: npm ci --ignore-scripts --prefix tool/rules

      - name: Test Firestore rules without production access
        run: npx --yes firebase-tools@15.1.0 emulators:exec --config firebase.qa.json --project demo-fjellfisk-qa --only firestore "node --test tool/rules/rules.test.cjs"
